name: AutoHeal AI
description: Free, self-hosted AI agent that fixes failing Playwright tests in your own GitHub Actions, with your own AI key.
author: xsignon-secure
branding:
  icon: activity
  color: green

inputs:
  report:
    description: Folder with the failed run's downloaded artifacts (Playwright JSON or blob report and test-results), a report file, or a run URL.
    default: autoheal-artifacts
  mode:
    description: "comment (explain only), draft-pr (default) or pr. Pass the same mode to the publish action."
    default: draft-pr
  working-directory:
    description: Folder of the Playwright (or pytest-playwright) project.
    default: .
  anthropic-api-key:
    description: Your Anthropic API key (default provider, model claude-opus-5-5).
    default: ''
  openai-api-key:
    description: Your OpenAI API key (set model too).
    default: ''
  base-url:
    description: OpenAI-compatible endpoint for a local or self-hosted model (set model too).
    default: ''
  model:
    description: Model id. Default for Anthropic is claude-opus-5-5.
    default: ''
  effort:
    description: Anthropic effort (low, medium, high, xhigh, max).
    default: medium
  max-failures:
    description: Failures to work on per run.
    default: '3'
  repeat-each:
    description: How many times in a row a fix must pass before it is kept.
    default: '5'
  max-usd:
    description: AI cost limit per job, in US dollars (estimate).
    default: '1.00'
  quarantine-days:
    description: How long a flaky test stays quarantined.
    default: '14'
  allow-warn:
    description: Accept anti-cheat WARN findings (raised timeouts). Default false blocks them. Fixed waits and force are always blocked.
    default: 'false'
  app-url:
    description: URL of a running copy of the app, for live locator checks (optional).
    default: ''
  mocks-base-url:
    description: Live API base URL to compare mocks with (optional).
    default: ''
  open-issues:
    description: Open issues for app bugs (only when AutoHeal is at least issue-min-confidence sure). Set false to list them in the job summary only.
    default: 'true'
  issue-min-confidence:
    description: How sure AutoHeal must be (0 to 1) before it opens an app-bug issue.
    default: '0.6'
  price-in:
    description: US dollars per million input tokens, for models AutoHeal has no price for (use 0 for a local model).
    default: ''
  price-out:
    description: US dollars per million output tokens, for models AutoHeal has no price for (use 0 for a local model).
    default: ''
  run-id:
    description: ID of the failed run (the template resolves it for manual runs).
    default: ''
  commit:
    description: Commit of the failed run.
    default: ''
  branch:
    description: Branch of the failed run.
    default: ''
  result-name:
    description: Name of the artifact the publish job downloads.
    default: autoheal-result
  github-token:
    description: Only used to download a run given as a URL. The heal job needs no write access.
    default: ${{ github.token }}

outputs:
  outcome:
    description: fixed, blocked, app-bug, quarantined, unfixed, nothing-to-do or error
    value: ${{ steps.heal.outputs.outcome }}
  fixed:
    description: Number of tests fixed
    value: ${{ steps.heal.outputs.fixed }}
  blocked:
    description: Number of fixes blocked by the anti-cheat guard
    value: ${{ steps.heal.outputs.blocked }}
  has-result:
    description: true when a result was uploaded for the publish job
    value: ${{ steps.package.outputs.result-dir != '' }}

runs:
  using: composite
  steps:
    - name: Install AutoHeal AI
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<13)) { console.error("::error::AutoHeal AI needs Node 22.13 or newer. Add actions/setup-node with node-version: 22 before this step."); process.exit(1) }'
        # dist/ is prebuilt and committed, so only runtime packages are installed, with no install scripts.
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error

    - name: Heal
      id: heal
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_REPORT: ${{ inputs.report }}
        AUTOHEAL_MODE: ${{ inputs.mode }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        AUTOHEAL_BASE_URL: ${{ inputs.base-url }}
        AUTOHEAL_MODEL: ${{ inputs.model }}
        AUTOHEAL_EFFORT: ${{ inputs.effort }}
        AUTOHEAL_MAX_FAILURES: ${{ inputs.max-failures }}
        AUTOHEAL_REPEAT_EACH: ${{ inputs.repeat-each }}
        AUTOHEAL_MAX_USD: ${{ inputs.max-usd }}
        AUTOHEAL_QUARANTINE_DAYS: ${{ inputs.quarantine-days }}
        AUTOHEAL_ALLOW_WARN: ${{ inputs.allow-warn == 'true' && '1' || '' }}
        AUTOHEAL_APP_URL: ${{ inputs.app-url }}
        AUTOHEAL_MOCKS_BASE_URL: ${{ inputs.mocks-base-url }}
        AUTOHEAL_OPEN_ISSUES: ${{ inputs.open-issues }}
        AUTOHEAL_ISSUE_MIN_CONFIDENCE: ${{ inputs.issue-min-confidence }}
        AUTOHEAL_PRICE_IN: ${{ inputs.price-in }}
        AUTOHEAL_PRICE_OUT: ${{ inputs.price-out }}
        AUTOHEAL_RUN_ID: ${{ inputs.run-id || github.event.workflow_run.id || github.event.inputs.run_id || github.run_id }}
        AUTOHEAL_RUN_URL: ${{ github.event.workflow_run.html_url }}
        AUTOHEAL_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        AUTOHEAL_BRANCH: ${{ inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}
        AUTOHEAL_OWNER: '@${{ github.event.workflow_run.actor.login || github.actor }}'
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" heal --report "$INPUT_REPORT" --out "$RUNNER_TEMP/autoheal-out"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # 3 = a fix was blocked: the good fixes still get a PR; the publish job fails at the end.
        if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi
        exit 0

    - name: Package the result
      id: package
      if: always() && steps.heal.outputs.exit-code != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUT: ${{ runner.temp }}/autoheal-out
        RESULT: ${{ runner.temp }}/autoheal-result
      run: |
        node "$GITHUB_ACTION_PATH/scripts/package.mjs" "$OUT" "$RESULT"
        echo "result-dir=$RESULT" >> "$GITHUB_OUTPUT"

    # The heal job only uploads a patch. The publish job (publish/action.yml)
    # checks it in a fresh checkout and opens the PR, so the token that can
    # push never shares a job with your tests or the AI's proposed fixes.
    - name: Upload the result for the publish job
      if: always() && steps.package.outputs.result-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.result-name }}
        path: ${{ steps.package.outputs.result-dir }}
        retention-days: 3
        if-no-files-found: ignore

name: AutoHeal AI publish
description: Second job of AutoHeal AI. Checks the heal job's patch in a fresh checkout, opens the fix PR (with before/after screenshots), app-bug issues and comment, and starts your CI on the PR. Never runs your project's code.
author: xsignon-secure
branding:
  icon: git-pull-request
  color: green

inputs:
  result-dir:
    description: Folder where the heal job's result artifact was downloaded.
    default: autoheal-result
  mode:
    description: "comment (explain only), draft-pr (default) or pr. Nothing is ever pushed to your base branch."
    default: draft-pr
  base-branch:
    description: Branch the fix PR targets (the branch whose run failed).
    required: true
  run-id:
    description: ID of the failed run.
    required: true
  commit:
    description: Commit of the failed run (comment mode comments on it when there is no PR).
    default: ''
  pr-number:
    description: Pull request of the failed run, for comment mode.
    default: ''
  blocked:
    description: The heal job's blocked count; the job fails when it is above 0.
    default: '0'
  open-issues:
    description: Open issues for confident app bugs. Set false to skip them.
    default: 'true'
  github-token:
    description: Token for pushing the fix branch and opening PRs and issues. The default token works; CI on the fix PR is started through rerun-workflow.
    default: ${{ github.token }}
  allowed-paths:
    description: "Globs (comma or newline separated) of files a fix may change. Default: **/tests/**, **/test/**, **/e2e/**, **/playwright/**, **/*.spec.*, **/*.test.*, **/*.cy.*, **/test_*.py, **/*_test.py. Set it if your page objects live elsewhere."
    default: ''
  allow-warn:
    description: Accept fixes with WARN findings (raised timeouts). Keep it the same as the heal action's allow-warn.
    default: 'false'
  quarantine-days:
    description: Longest quarantine a patch may set (days, at most 90). Keep it the same as the heal action's quarantine-days.
    default: '14'
  fix-target:
    description: "new-pr (default) opens a separate fix PR against the failing branch. pr-branch pushes the fix as one more commit onto the failing PR's own branch (never the default branch, never forced; falls back to new-pr). Either way the failing PR gets a comment with the fix."
    default: new-pr
  rerun-workflow:
    description: "File name of your test workflow (e.g. playwright.yml). The publish job starts it on the fix branch with workflow_dispatch, so the PR gets its CI checks even with the default token. Needs `actions: write` and `workflow_dispatch:` in that workflow. Empty: skip."
    default: ''
  dashboard-url:
    description: Your self-hosted AutoHeal dashboard (optional).
    default: ''
  dashboard-secret:
    description: Signing secret shared with the dashboard (optional).
    default: ''

outputs:
  pr-url:
    description: The fix pull request, when one was opened or updated
    value: ${{ steps.publish.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Publish
      id: publish
      shell: bash
      env:
        RESULT_DIR: ${{ inputs.result-dir }}
        MODE: ${{ inputs.mode }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        RUN_ID: ${{ inputs.run-id }}
        COMMIT: ${{ inputs.commit }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BLOCKED: ${{ inputs.blocked }}
        OPEN_ISSUES: ${{ inputs.open-issues }}
        GH_TOKEN: ${{ inputs.github-token }}
        DASHBOARD_URL: ${{ inputs.dashboard-url }}
        DASHBOARD_SECRET: ${{ inputs.dashboard-secret }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        ALLOW_WARN: ${{ inputs.allow-warn }}
        QUARANTINE_DAYS: ${{ inputs.quarantine-days }}
        RERUN_WORKFLOW: ${{ inputs.rerun-workflow }}
        FIX_TARGET: ${{ inputs.fix-target }}
      run: node "$GITHUB_ACTION_PATH/../scripts/publish.mjs"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is up to date
        if: matrix.node == 22
        run: git diff --exit-code --stat -- dist || { echo "::error::Run npm run build and commit dist/."; exit 1; }
      - run: npm pack --dry-run

  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the dummy shop's Playwright
        working-directory: simulation/fixture
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: python3 -m pip install --user pyyaml
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm run simulate

  dashboard-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t autoheal-dashboard .
      - name: Smoke test
        run: |
          docker run -d --name dash -p 8080:8080 -e AUTOHEAL_DASHBOARD_SECRET=ci-secret-0123456789-abcdefghijklmnop -e AUTOHEAL_DASHBOARD_VIEW_TOKEN=ci-view-token-0123456789 autoheal-dashboard
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs dash; exit 1

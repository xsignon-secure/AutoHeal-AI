# AutoHeal AI metrics: copy this file to .github/workflows/autoheal-metrics.yml.
#
# Once a week (and on demand) it writes a report to the job summary: AutoHeal
# fix PRs merged, edited and closed, fixes by kind, AI spend, time saved,
# app-bug issues, and quarantined tests that have expired or expire soon.
# It reads only: no AI key, no tests, nothing is changed.

name: AutoHeal metrics

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to look back
        default: '30'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: AutoHeal metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: npx --yes xsignon-autoheal@0.9.0 metrics --days "$DAYS" --json autoheal-metrics.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoheal-metrics
          path: autoheal-metrics.json
          retention-days: 90
